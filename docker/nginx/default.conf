server {
    listen 80;
    server_name _;

    # Cho phép upload file tới 20MB (import Excel sản phẩm)
    client_max_body_size 20M;

    # Đường dẫn bắt đầu bằng /api/ là gọi API: chuyển sang Flask (gunicorn) trong container app
    location /api/ {
        proxy_pass http://app:5000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # /health của Flask nằm ngoài /api nên khai riêng
    location = /health {
        proxy_pass http://app:5000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Mọi đường dẫn còn lại: trả file Vue đã build (frontend/dist, mount vào đây)
    location / {
        root /usr/share/nginx/html;
        # /products không phải file có thật trên đĩa.
        # Không tìm thấy file thì trả index.html để Vue Router tự chọn trang.
        try_files $uri $uri/ /index.html;
    }
}
